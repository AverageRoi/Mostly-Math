[goldmark.renderer]
  unsafe = true

[goldmark.extensions.passthrough]
  enable = true

[goldmark.extensions.passthrough.delimiters]
  block  = [['\[', '\]'], ['$$', '$$']]
  inline = [['\(', '\)']]

[tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false

[highlight]
  noClasses = false
  codeFences = true
